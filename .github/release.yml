# Configuration for GitHub's automatically generated release notes.
# The release workflow creates the GitHub Release with generate_release_notes: true,
# which reads this file. Categories match pull-request LABELS only (GitHub does not
# match on PR titles), so label PRs feat/fix/docs or they land under "Other changes".
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
