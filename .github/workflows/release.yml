name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify release versions
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      # Build TypeScript packages
      - name: Build daemon
        run: |
          npm ci
          npm run build
        working-directory: packages/moe-daemon

      - name: Build proxy
        run: |
          npm ci
          npm run build
        working-directory: packages/moe-proxy

      - name: Verify fresh project onboarding
        run: node scripts/tests/onboarding.mjs

      # Build JetBrains plugin
      - name: Build plugin
        run: ./gradlew buildPlugin
        working-directory: moe-jetbrains

      # Build VS Code / Antigravity extension (.vsix)
      - name: Package VS Code extension
        run: |
          npm ci
          npm run package
        working-directory: moe-vscode

      - name: Verify packaged onboarding
        run: |
          unzip -q moe-jetbrains/build/distributions/*.zip -d "$RUNNER_TEMP/moe-plugin-smoke"
          node scripts/tests/onboarding.mjs "$RUNNER_TEMP/moe-plugin-smoke/moe-jetbrains"
          unzip -q moe-vscode/*.vsix -d "$RUNNER_TEMP/moe-vscode-smoke"
          node scripts/tests/onboarding.mjs "$RUNNER_TEMP/moe-vscode-smoke/extension/bundled"

      # Publish to npm (when NPM_TOKEN is configured)
      - name: Publish daemon to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        working-directory: packages/moe-daemon
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish proxy to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        working-directory: packages/moe-proxy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            moe-jetbrains/build/distributions/*.zip
            moe-vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the packaged .vsix to the VS Code Marketplace (when VSCE_PAT is configured)
      - name: Publish VS Code extension to Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        run: npx --yes @vscode/vsce@latest publish --packagePath "$(ls moe-vscode/*.vsix)"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Publish the same .vsix to Open VSX (when OVSX_PAT is configured)
      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        run: npx --yes ovsx publish "$(ls moe-vscode/*.vsix)"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Publish to JetBrains Marketplace (when configured)
  publish-plugin:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    needs: build-and-release
    env:
      HAS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/moe-daemon/package-lock.json

      - name: Build daemon
        run: |
          npm ci
          npm run build
        working-directory: packages/moe-daemon

      - name: Build proxy
        run: |
          npm ci
          npm run build
        working-directory: packages/moe-proxy

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Publish plugin
        if: env.HAS_PUBLISH_TOKEN == 'true'
        run: ./gradlew publishPlugin
        working-directory: moe-jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
