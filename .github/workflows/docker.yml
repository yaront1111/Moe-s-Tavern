name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/moe-daemon/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/moe-daemon/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# Same rule as ci.yml: one running and at most one queued run per PR or ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/moe-daemon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./packages/moe-daemon
          file: ./packages/moe-daemon/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t moe-daemon-test ./packages/moe-daemon
          expected_version=$(node -p "require('./packages/moe-daemon/package.json').version")
          actual_version=$(docker run --rm moe-daemon-test --version)
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Expected daemon version $expected_version, got: $actual_version" >&2
            exit 1
          fi

          # Serve this checkout (its .moe/project.json is tracked) the way the docs do: mounted at its own
          # path, published on host loopback only, and run as the checkout's owner so it can write .moe/.
          name="moe-daemon-health-${GITHUB_RUN_ID:-local}-$$"
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then docker logs "$name" 2>&1 | tail -n 40 || true; fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT
          docker run -d --name "$name" --user "$(id -u):$(id -g)" -p 127.0.0.1::9876 \
            -v "$PWD":"$PWD" -e MOE_PROJECT_PATH="$PWD" moe-daemon-test
          port=$(docker port "$name" 9876/tcp | head -n 1)
          port=${port##*:}
          health=""
          for _ in $(seq 1 30); do
            if health=$(curl -fsS -m 2 "http://127.0.0.1:$port/health"); then break; fi
            health=""
            sleep 1
          done
          HEALTH="$health" EXPECTED="$PWD" node -e '
            let h = {};
            try { h = JSON.parse(process.env.HEALTH) ?? {}; } catch {}
            if (h.status !== "healthy" || h.projectPath !== process.env.EXPECTED) {
              console.error(`Expected a healthy daemon serving ${process.env.EXPECTED} on 127.0.0.1, got: ${process.env.HEALTH || "no answer"}`);
              process.exit(1);
            }
            console.log(`healthy: ${h.projectPath}`);
          '
          # The image's own HEALTHCHECK command must pass inside the container too.
          docker exec "$name" sh -c "$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' moe-daemon-test)"
          echo "image HEALTHCHECK passed"
